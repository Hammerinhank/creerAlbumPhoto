<script>
  const shortcutName = "CreerAlbumsMultiples";
  const albums = ["Vacances", "Famille", "Projets"];
  
  // On récupère l'URL propre de la page sans paramètres
  const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;

  // On construit les paramètres de retour
  const successCallback = `${cleanUrl}?status=success&count=${albums.length}`;
  const errorCallback = `${cleanUrl}?status=error`;

  const inputData = albums.join(",");

  // Construction propre du lien X-Callback
  const finalShortcutUrl = `shortcuts://x-callback-url/run-shortcut?` +
    `name=${encodeURIComponent(shortcutName)}` +
    `&input=${encodeURIComponent(inputData)}` +
    `&x-success=${encodeURIComponent(successCallback)}` +
    `&x-cancel=${encodeURIComponent(errorCallback)}` +
    `&x-error=${encodeURIComponent(errorCallback)}`;

  const linkEl = document.getElementById("shortcutLink");
  const statusBox = document.getElementById("statusBox");

  linkEl.href = finalShortcutUrl;

  linkEl.addEventListener("click", () => {
    statusBox.className = "status-box status-running";
    statusBox.style.display = "block";
    statusBox.innerHTML = "⏳ Communication avec iOS en cours...";
  });

  // Lecture du retour iOS
  const urlParams = new URLSearchParams(window.location.search);
  const status = urlParams.get("status");

  if (status === "success") {
    const count = urlParams.get("count") || "";
    statusBox.className = "status-box status-success";
    statusBox.style.display = "block";
    statusBox.innerHTML = `✅ <strong>Succès !</strong> ${count} album(s) créé(s) avec succès dans Photos.`;
    
    // Nettoie l'URL dans la barre d'adresse
    window.history.replaceState({}, document.title, window.location.pathname);
  } else if (status === "error") {
    statusBox.className = "status-box status-error";
    statusBox.style.display = "block";
    statusBox.innerHTML = "❌ <strong>Échec :</strong> L'opération a été annulée ou une erreur est survenue.";
    
    window.history.replaceState({}, document.title, window.location.pathname);
  }
</script>
